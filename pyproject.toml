[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cellduet"
version = "0.0.1"
description = "Cross-modality phenotype concordance for small-molecule perturbations across transcriptomic and image-based morphological readouts"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Patrick J. Reed", email = "patrickjenningsreed@gmail.com" }]
keywords = ["single-cell", "perturb-seq", "cell-painting", "rxrx3", "tahoe-100m", "foundation-models", "multimodal"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "pyarrow>=15.0",
  "scipy>=1.11",
  "scikit-learn>=1.3",
  "anndata>=0.10",
  "scanpy>=1.10",
  "huggingface_hub>=0.24",
  "datasets>=2.20",
  "matplotlib>=3.8",
  "seaborn>=0.13",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "jupyterlab>=4.0",
]
chem = [
  "rdkit>=2024.3",
]
aws = [
  "s3fs>=2024.2",
  "boto3>=1.34",
]
cellpainting = [
  "pycytominer>=1.0",
]
torch = [
  "torch>=2.2",
]

[project.urls]
Homepage = "https://github.com/PatrickJReed/cellduet"

[tool.hatch.build.targets.wheel]
packages = ["src/cellduet"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Matrix-name conventions in scientific modules: D1, D2, X, A, B are
# universally accepted single-letter capitals for distance/sample/kernel
# matrices and should not be flagged as N803 (argument) or N806 (variable).
"src/cellduet/stats.py" = ["N803", "N806"]
"src/cellduet/rxrx3.py" = ["N803", "N806"]
"tests/test_stats.py" = ["N803", "N806"]
"tests/test_rxrx3.py" = ["N806"]
